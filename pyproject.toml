[project]
name = "chatchtg"
version = "0.1.0"
description = "Junction demo of a drawing conversational platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "streamlit>=1.40",
]

[project.scripts]
chatchtg = "chatchtg.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatchtg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
