[project]
name = "chatchtg"
version = "0.1.0"
description = "Junction demo of a drawing conversational platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "certifi>=2026.10.23",
    "pillow>=13.0.0",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "streamlit>=1.40",
]

[project.scripts]
chatchtg = "chatchtg.cli:main"

[project.optional-dependencies]
detect = [
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.23.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatchtg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
