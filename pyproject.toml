[project]
name = "chatchtg"
version = "0.1.0"
description = "Junction demo of a drawing conversational platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.7",
    "pyobjc-framework-vision>=13.0 ; sys_platform == 'darwin'",
    "python-dotenv>=1.2.4",
    "streamlit>=1.40",
]

[project.scripts]
chatchtg = "chatchtg.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatchtg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
